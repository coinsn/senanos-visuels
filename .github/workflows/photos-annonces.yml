name: Photos des annonces

# Récupère les photos des annonces listées dans annonces/a-recuperer.txt
# (une adresse d'annonce senanos.com par ligne) et les range dans
# annonces/<id-de-l-annonce>/1.jpg, 2.jpg, ...

on:
  push:
    paths:
      - 'annonces/a-recuperer.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photos-annonces
  cancel-in-progress: false

jobs:
  recuperer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les photos
        run: |
          python3 - <<'PY'
          import html, os, re, urllib.request

          LISTE = 'annonces/a-recuperer.txt'
          UA = {'User-Agent': 'Mozilla/5.0 (SenAnos photos; +https://senanos.com)'}
          MAX_PHOTOS = 4
          MOTIF = re.compile(r'https://storage\.googleapis\.com/senanos-bkt/annonces/[^"\'\s<>\\]+')

          def lire(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          if not os.path.exists(LISTE):
              raise SystemExit('Pas de liste : rien à faire.')

          for ligne in open(LISTE, encoding='utf-8'):
              url = ligne.strip()
              if not url or url.startswith('#'):
                  continue
              if not url.startswith('https://senanos.com/annonces/'):
                  print('Ignoré (pas une annonce senanos.com) :', url)
                  continue
              ident = url.rstrip('/').split('/')[-1]
              if not re.fullmatch(r'[A-Za-z0-9_-]+', ident):
                  print('Ignoré (identifiant inattendu) :', url)
                  continue
              dossier = f'annonces/{ident}'
              if os.path.isdir(dossier) and os.listdir(dossier):
                  print('Déjà récupéré :', ident)
                  continue
              try:
                  page = lire(url).decode('utf-8', 'replace')
              except Exception as e:
                  print('Page illisible :', url, e)
                  continue
              photos = []
              for m in MOTIF.findall(page):
                  u = html.unescape(m)
                  if u not in photos:
                      photos.append(u)
              if not photos:
                  print('Aucune photo trouvée :', url)
                  continue
              os.makedirs(dossier, exist_ok=True)
              n = 0
              for u in photos[:MAX_PHOTOS]:
                  try:
                      data = lire(u)
                  except Exception as e:
                      print('Photo illisible :', ident, e)
                      continue
                  if len(data) < 1000:
                      continue
                  n += 1
                  with open(f'{dossier}/{n}.jpg', 'wb') as f:
                      f.write(data)
              print(f'{ident} : {n} photo(s)')
          PY

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "coinsn"
          git config user.email "coinsn@users.noreply.github.com"
          git add annonces
          git diff --cached --quiet || git commit -m "Photos des annonces"
          git push
