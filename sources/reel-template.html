.btn{background:#d7263d;color:#fff;border-radius:999px;text-align:center;font-weight:600;font-size:38px;padding:26px}
.ok{position:absolute;left:40px;right:40px;top:380px;background:#fff;border-radius:34px;box-shadow:0 24px 60px rgba(0,0,0,.2);padding:40px;text-align:center;opacity:0}
.ok .c{width:120px;height:120px;border-radius:50%;background:#e8f6ee;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
.zero{font-family:Fraunces;font-weight:700;font-size:300px;color:#d7263d;line-height:1}

 <div class="f"><label>Titre</label><div id="f1"></div></div>

<script>
const D=17;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const e=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function vis(id,t,a,b,f=.35){const el=document.getElementById(id);let o=cl((t-a)/f)*cl((b-t)/f);el.style.opacity=o;return o;}
function type(id,s,t,a,dur){const n=Math.floor(cl((t-a)/dur)*s.length);document.getElementById(id).textContent=s.slice(0,n)+((t>a&&t<a+dur+.3&&Math.floor(t*3)%2==0)?'|':'');}
const subs=[[0,3,'Tu as un téléphone à vendre ?'],[3,10.3,'Publie ton annonce sur SenAnos en quelques minutes'],[10.3,13.5,'Zéro commission sur ta vente'],[13.5,17,'Publie ton annonce sur senanos.com']];
window.render=function(t){
 document.getElementById('g1').style.transform=`translate(${Math.sin(t*.5)*40}px,${Math.cos(t*.4)*40}px)`;
 document.getElementById('g2').style.transform=`translate(${Math.cos(t*.45)*40}px,${Math.sin(t*.5)*40}px)`;
 document.getElementById('brand').style.opacity=e(t/.6);
 // s1
 vis('s1',t,0,3.1,.3); document.getElementById('em1').style.transform=`scale(${back((t-.1)/.5)}) rotate(${Math.sin(t*6)*8*cl(1-(t-.8))}deg)`;
 document.getElementById('t1').style.transform=`translateY(${(1-e((t-.25)/.6))*80}px)`;
 // s2
 vis('s2',t,3,10.4,.35); document.getElementById('ph').style.transform=`translateY(${(1-e((t-3)/.7))*300}px) scale(${.92+.08*e((t-3)/.7)})`;
 type('f1','iPhone 13 Pro 128 Go',t,4.0,1.3); type('f2','230 000 F',t,5.6,.8); type('f3','Dakar',t,6.7,.5);
 const pr=t>7.6&&t<7.9?.93:1; document.getElementById('pub').style.transform=`scale(${pr})`;
 const ok=document.getElementById('ok'); const ko=cl((t-8)/.3); ok.style.opacity=ko; ok.style.transform=`scale(${.6+.4*back((t-8)/.5)})`;
 // s3
 vis('s3',t,10.3,13.6,.3); document.getElementById('zero').style.transform=`scale(${back((t-10.4)/.6)})`;
 // s4
 vis('s4',t,13.5,D+1,.35); document.getElementById('cta').style.transform=`scale(${1+.04*Math.sin((t-14)*5)*(t>14.5?1:0)})`;
 // subs
 let s=subs.find(x=>t>=x[0]&&t<x[1]); document.getElementById('subt').textContent=s?s[2]:''; document.getElementById('sub').style.opacity=s?cl((t-s[0])/.25)*cl((s[1]-t)/.25):0;
 document.getElementById('bar').style.width=(t/D*100)+'%';
};
render(0);
</script></body></html>
